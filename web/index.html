<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>GBclaw</title>
  <link id="brand-favicon" rel="icon" href="/brand-assets/GBClaw-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/vendor/katex.min.css?v=0.16.22" />
  <link rel="stylesheet" href="assets/vendor/github-dark.min.css" />
  <link rel="stylesheet" href="assets/css/main.css?v=11" />
  <link rel="stylesheet" href="assets/css/dichromatic_widget.css?v=3" />
</head>
<body>
  <script>(function(){try{var k="gbclaw.theme";var t=localStorage.getItem(k);if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
  <header>
    <div class="brand">
      <img id="brand-logo" class="logo" src="/brand-assets/GBClaw-icon.svg" alt="GBClaw" width="44" height="44" />
      <div>
        <h1 id="brand-name"></h1>
        <p id="brand-tagline"></p>
      </div>
    </div>
    <div class="header-actions">
      <div class="project-bar" id="project-bar">
        <span class="project-label" id="project-label"></span>
        <code class="project-id" id="project-id" title=""></code>
        <button type="button" id="project-switch-btn" class="project-switch-btn"></button>
      </div>
      <div id="status-badge" class="status-badge">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text"></span>
      </div>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme" aria-pressed="false">
        <span class="theme-toggle-icon theme-toggle-icon-sun" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m4.93 19.07 1.41-1.41"></path>
            <path d="m17.66 6.34 1.41-1.41"></path>
          </svg>
        </span>
        <span class="theme-toggle-icon theme-toggle-icon-moon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </span>
        <span class="theme-toggle-track" aria-hidden="true">
          <span class="theme-toggle-thumb"></span>
        </span>
        <span id="theme-toggle-label" class="theme-toggle-label">Light</span>
      </button>
    </div>
  </header>

  <div class="workspace" id="workspace">
    <aside class="files-panel" id="files-panel" aria-label="Project files">
      <div class="files-panel-header">
        <h2 id="files-panel-title"></h2>
        <button type="button" id="files-refresh-btn" class="files-refresh-btn"></button>
      </div>
      <nav id="files-breadcrumb" class="files-breadcrumb" aria-label="Folder path"></nav>
      <ul id="files-list" class="files-list"></ul>
      <p id="files-empty" class="files-empty" hidden></p>
      <div id="files-citation" class="files-citation" aria-label="Citation"></div>
      <div
        class="panel-resizer panel-resizer-files"
        id="files-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize files panel"
        tabindex="0"
      ></div>
    </aside>

    <div class="chat-column">
      <main>
        <section class="welcome" id="welcome">
          <h2 id="welcome-title"></h2>
          <p id="welcome-description"></p>
          <div class="chips" id="suggestions"></div>
        </section>

        <div id="chat-log" role="log" aria-live="polite"></div>

        <form class="composer" id="chat-form">
          <section id="plan-approval" class="plan-approval" hidden aria-live="polite">
            <div class="plan-approval-copy">
              <strong id="plan-approval-title"></strong>
              <span id="plan-approval-meta"></span>
            </div>
            <div class="plan-approval-actions">
              <button type="button" id="plan-request-changes-btn" class="plan-request-changes-btn"></button>
              <button type="button" id="plan-approve-btn" class="plan-approve-btn"></button>
            </div>
          </section>
          <div class="composer-input">
            <div id="slash-menu" class="slash-menu" hidden role="listbox" aria-label="Slash commands"></div>
            <div class="input-row">
              <textarea
                id="user-input"
                rows="1"
                aria-autocomplete="list"
                aria-controls="slash-menu"
                aria-expanded="false"
              ></textarea>
              <button id="stop-btn" type="button" hidden>
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <rect x="7" y="7" width="10" height="10" rx="1.5"></rect>
                </svg>
              </button>
              <button id="send-btn" type="submit">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M22 2L11 13"></path>
                  <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
                </svg>
              </button>
            </div>
          </div>
          <p class="hint">
            <span id="hint-prefix"></span><code id="hint-endpoint"></code><span id="hint-project-prefix"></span><code id="project-id-hint"></code><span id="hint-thread-prefix"></span><code id="thread-id"></code>
          </p>
        </form>
        <div class="composer-spacer" aria-hidden="true"></div>
      </main>
    </div>

    <aside class="file-preview-panel" id="file-preview-panel" hidden aria-label="File preview">
      <div
        class="panel-resizer panel-resizer-preview"
        id="preview-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize preview panel"
        tabindex="0"
      ></div>
      <div class="file-preview-header">
        <code id="file-preview-name" class="file-preview-name"></code>
        <span id="file-preview-badge" class="file-preview-badge" hidden></span>
        <a id="file-preview-download" class="file-preview-download" href="#" download></a>
        <button type="button" id="file-preview-close" class="file-preview-close"></button>
      </div>
      <pre id="file-preview-content" class="file-preview-content"></pre>
    </aside>
  </div>

  <footer>
    <span id="footer-text"></span>
  </footer>

  <div id="project-modal" class="project-modal" hidden>
    <div class="project-modal-backdrop" id="project-modal-backdrop"></div>
    <div class="project-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
      <div class="project-modal-header">
        <h3 id="project-modal-title"></h3>
        <button type="button" id="project-modal-close" class="project-modal-close" aria-label="Close"></button>
      </div>
      <p class="project-modal-hint" id="project-modal-hint"></p>
      <ul id="project-list" class="project-list"></ul>
      <div class="project-modal-actions">
        <button type="button" id="project-new-btn" class="project-new-btn"></button>
      </div>
    </div>
  </div>

  <div id="image-modal" class="image-modal" hidden>
    <div class="image-modal-backdrop" id="image-modal-backdrop"></div>
    <div class="image-modal-dialog" role="dialog" aria-modal="true" aria-label="Image preview">
      <div class="image-modal-header">
        <code id="image-modal-name" class="image-modal-name"></code>
        <div class="image-modal-tools">
          <button type="button" id="image-zoom-out" class="image-modal-btn" title="Zoom out" aria-label="Zoom out">−</button>
          <span id="image-zoom-level" class="image-zoom-level">100%</span>
          <button type="button" id="image-zoom-in" class="image-modal-btn" title="Zoom in" aria-label="Zoom in">+</button>
          <button type="button" id="image-zoom-reset" class="image-modal-btn" title="Reset zoom">Reset</button>
          <a id="image-modal-download" class="image-modal-btn" href="#" download title="Download">↓</a>
          <button type="button" id="image-modal-close" class="image-modal-btn image-modal-close" title="Close" aria-label="Close">×</button>
        </div>
      </div>
      <div class="image-modal-stage" id="image-modal-stage">
        <img id="image-modal-img" alt="" draggable="false" />
      </div>
    </div>
  </div>

  <script defer src="assets/vendor/marked.min.js"></script>
  <script defer src="assets/vendor/purify.min.js"></script>
  <script defer src="assets/vendor/katex.min.js"></script>
  <script defer src="assets/vendor/highlight.min.js"></script>
  <script type="module" src="assets/js/app.js?v=25"></script>
</body>
</html>
